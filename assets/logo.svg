<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 48" fill="none">
  <defs>
    <style>
      .logo-main-text {
        fill: #F8FAFC;
      }
      @media (prefers-color-scheme: light) {
        .logo-main-text {
          fill: #0F172A;
        }
      }
    </style>
    <linearGradient id="logo-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366F1" />
      <stop offset="50%" stop-color="#8B5CF6" />
      <stop offset="100%" stop-color="#EC4899" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#8B5CF6" flood-opacity="0.35"/>
    </filter>
  </defs>
  <!-- Icon Symbol -->
  <rect x="4" y="6" width="36" height="36" rx="10" fill="url(#logo-grad)" filter="url(#glow)"/>
  <path d="M14 18H30M14 24H26M14 30H22" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round"/>
  <circle cx="28" cy="27" r="3" fill="#FFFFFF"/>
  <path d="M25 33L31 33" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round"/>
  <!-- Text -->
  <text class="logo-main-text" x="50" y="31" font-family="-apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', Roboto, sans-serif" font-size="24" font-weight="800" letter-spacing="-0.5">Event<tspan fill="url(#logo-grad)">OS</tspan></text>
</svg>
