<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Registration Successful - EventOS</title>
  <meta name="description" content="Your registration has been confirmed. View and print your official digital QR admission pass.">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/tickets.css">
  <link rel="stylesheet" href="css/responsive.css">
  <style>
    .success-container {
      max-width: 600px;
      margin: 0 auto;
      padding: 3rem 1.5rem 5rem;
      text-align: center;
    }
    .check-icon-circle {
      width: 72px;
      height: 72px;
      border-radius: 50%;
      background: rgba(16, 185, 129, 0.15);
      border: 2px solid var(--success-border);
      color: var(--success);
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 1.5rem;
      box-shadow: 0 0 30px rgba(16, 185, 129, 0.25);
    }
  </style>
</head>
<body style="background: radial-gradient(circle at 50% 0%, #151d33 0%, var(--bg-main) 75%); min-height: 100vh;">

  <div class="success-container">
    <div class="no-print">
      <div class="check-icon-circle">
        <svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M20 6L9 17l-5-5"/></svg>
      </div>

      <span class="badge badge-success" style="margin-bottom: 0.75rem; font-size: 0.82rem;">Confirmed & Verified</span>
      <h1 style="font-size: 2.2rem; font-weight: 800; margin-bottom: 0.4rem;">Registration Successful!</h1>
      <p style="font-size: 1.05rem; color: var(--text-secondary); margin-bottom: 0.5rem;">
        Welcome, <strong id="succ-attendee-name" style="color: var(--text-main);">Swastik Paul</strong>
      </p>
      <div style="font-size: 0.9rem; color: var(--text-muted); margin-bottom: 2rem;">
        Registration Code: <span class="mono" id="succ-reg-id" style="color: var(--primary); font-weight: 700;">REG-2026-0000</span>
      </div>
    </div>

    <!-- Digital Ticket Pass (Section 22, 23, 33) -->
    <div class="ticket-wrapper" style="padding: 0 0 2rem;">
      <div class="ticket-card" id="printable-ticket">
        <div class="ticket-top">
          <div class="ticket-brand">
            <span class="ticket-brand-logo">EVENTOS PASS</span>
            <span class="badge" id="succ-tier-badge" style="background: rgba(99, 102, 241, 0.2); color: #818CF8; border: 1px solid rgba(99, 102, 241, 0.4); font-weight: 800;">
              VIP PASS
            </span>
          </div>

          <h2 class="ticket-event-name" id="pass-event-name">Event Title</h2>

          <div class="ticket-attendee-info">
            <div class="ticket-attendee-name" id="pass-attendee-name">Attendee Name</div>
            <div class="ticket-reg-id" id="pass-reg-id">REG-2026-0000 &bull; TKT-2026-0000</div>
          </div>
        </div>

        <div class="ticket-bottom">
          <div class="ticket-qr-container">
            <canvas id="pass-qr-canvas" width="170" height="170"></canvas>
          </div>

          <div class="mono" style="font-size: 0.72rem; color: #94A3B8; margin-bottom: 1rem; letter-spacing: 0.05em;" id="pass-token-label">
            TOKEN: XXXXXXXX
          </div>

          <div class="ticket-meta-grid">
            <div class="ticket-meta-item">
              <span class="ticket-meta-label">Event Date</span>
              <span class="ticket-meta-val" id="pass-date-time">Date TBD</span>
            </div>
            <div class="ticket-meta-item">
              <span class="ticket-meta-label">Venue</span>
              <span class="ticket-meta-val" id="pass-venue">Venue TBD</span>
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- Actions (Section 33) -->
    <div style="display: flex; gap: 1rem; justify-content: center; flex-wrap: wrap;" class="no-print">
      <button class="btn btn-primary btn-lg" onclick="RegistrationSuccessController.printPass()">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="6 9 6 2 18 2 18 9"/><path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"/><rect x="6" y="14" width="12" height="8"/></svg>
        Print Ticket / PDF
      </button>
      <a href="#" id="succ-back-btn" class="btn btn-secondary btn-lg">Back to Event Page</a>
      <a href="dashboard.html" class="btn btn-ghost btn-lg">Go to Dashboard &rarr;</a>
    </div>
  </div>

  <!-- Scripts -->
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
  <script src="js/firebase-config.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/storage.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/services.js"></script>
  <script src="js/registration-success.js"></script>
</body>
</html>
